# Reglas propias de Semgrep.
#
# Los escaneres genericos detectan patrones conocidos de la industria. Estas reglas
# detectan los errores que comete el codigo generado en ESTE repositorio.
#
# Regla de oro: cada vez que un bug llegue al PR y lo atrapes en revision, escribe
# una regla aqui. Es la unica forma de que la revision humana no tenga que repetirse.

rules:
  - id: api-sin-verificacion-de-sesion
    languages: [typescript]
    severity: ERROR
    message: >-
      Este handler de API no llama a requireUser(). Todo endpoint bajo app/api/ debe
      verificar la sesion antes de hacer cualquier otra cosa. Si el endpoint es
      deliberadamente publico, agrega el comentario // publico-a-proposito con la razon.
    paths:
      include:
        - "app/api/**"
        - "src/app/api/**"
    patterns:
      - pattern: |
          export async function $METODO(...) { ... }
      - metavariable-regex:
          metavariable: $METODO
          regex: ^(GET|POST|PUT|PATCH|DELETE)$
      - pattern-not: |
          export async function $METODO(...) { ... requireUser(...); ... }
      - pattern-not-inside: |
          // publico-a-proposito
          ...

  - id: error-crudo-al-cliente
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Estas devolviendo el objeto de error o su mensaje al cliente. Eso filtra
      estructura de la base de datos y rutas del servidor. Devolve un mensaje generico
      y manda el detalle al logger.
    patterns:
      - pattern-either:
          - pattern: 'NextResponse.json({ ..., error: $E.message, ... }, ...)'
          - pattern: 'NextResponse.json({ ..., error: $E, ... }, ...)'
          - pattern: 'res.status($S).json({ ..., error: $E.stack, ... })'
      - metavariable-regex:
          metavariable: $E
          regex: ^(e|err|error|exception)$

  - id: cors-abierto
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      CORS con comodin. Lista los origenes permitidos explicitamente.
    pattern-either:
      - pattern: '{..., "Access-Control-Allow-Origin": "*", ...}'
      - pattern: 'cors({ ..., origin: "*", ... })'
      - pattern: 'cors({ ..., origin: true, ... })'

  - id: log-de-credencial
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Estas escribiendo una credencial al log. Los logs se guardan, se rotan y a
      veces se comparten.
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $X, ...)
          - pattern: logger.$M(..., $X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(password|passwd|token|secret|api_?key|authorization|jwt|refresh_?token).*

  - id: consulta-sin-filtro-de-dueno
    languages: [typescript]
    severity: WARNING
    message: >-
      Consulta de lectura sin clausula where. Si este recurso pertenece a un usuario,
      esto devuelve los registros de todos. Confirma que es intencional.
    pattern-either:
      - pattern: $DB.$TABLA.findMany()
      - pattern: $DB.$TABLA.findMany({})

  - id: html-sin-sanitizar
    languages: [typescript]
    severity: ERROR
    message: >-
      Uso de dangerouslySetInnerHTML. Confirma que el contenido esta sanitizado o es
      una constante propia del codigo — nunca texto que viene del usuario o de la
      base sin pasar por un sanitizador.
    patterns:
      - pattern: <$TAG dangerouslySetInnerHTML={...} />

  - id: sql-concatenado
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL armado con template string. Usa consultas parametrizadas.
    pattern-either:
      - pattern: $DB.$RAW(`... ${$X} ...`)
      - pattern: $DB.query(`... ${$X} ...`)
