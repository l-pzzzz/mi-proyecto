name: CI

# Este es el juez objetivo del agente. Si esto tarda más de 5 minutos,
# el bucle deja de funcionar: arréglalo antes que cualquier otra cosa.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios y de integración
        run: npm test -- --run

      - name: Tests de autorización
        # Se corren aparte para que quede evidente en el log cuando fallan.
        run: npm test -- --run tests/autorizacion

      - name: Build
        run: npm run build

  e2e:
    name: Navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  seguridad:
    name: Secretos, SAST y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo

      - name: Secretos filtrados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Dependencias con vulnerabilidad conocida
        run: npm audit --audit-level=high

      - name: Verificar que el lockfile no cambió sin querer
        run: git diff --exit-code package-lock.json

  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Reglas públicas + reglas propias
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=seguridad/reglas-propias.yml \
            --error
